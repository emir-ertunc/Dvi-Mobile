name: Phase 5A-Fix4 APK

on:
  push:
    branches:
      - feature/turkish-dvi-mobile
  workflow_dispatch:

jobs:
  android-apk:
    name: Android APK uretimi
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js hazirla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bagimliliklari kur
        run: npm ci

      - name: TypeScript kontrolu
        run: npm run typecheck

      - name: Turkce metin kontrolu
        run: npm run text:verify-tr

      - name: Yeniden baz alma kontrolu
        run: npm run rebaseline:verify

      - name: Fillable PDF forensics dogrulamasi
        run: npm run forensics:verify

      - name: AM envanter dogrulamasi
        run: npm run inventory:am:verify

      - name: PM envanter dogrulamasi
        run: npm run inventory:pm:verify

      - name: AM/PM ortak envanter denetimi
        run: npm run inventory:audit:verify

      - name: Field primitive dogrulamasi
        run: npm run schema:primitives:verify

      - name: AM schema dogrulamasi
        run: npm run schema:am:verify

      - name: PM schema dogrulamasi
        run: npm run schema:pm:verify

      - name: Schema coverage dogrulamasi
        run: npm run schema:coverage:verify

      - name: Yerel taslak saklama dogrulamasi
        run: npm run drafts:storage:verify

      - name: Ortak form renderer dogrulamasi
        run: npm run forms:renderer:verify

      - name: Turkce alan etiketi dogrulamasi
        run: npm run ui:labels:verify

      - name: UI kapsam dogrulamasi
        run: npm run ui:coverage:verify

      - name: Alan sozlesmesi dogrulamasi
        run: npm run field:contract:verify

      - name: PDF sablon dogrulamasi
        run: npm run pdf:templates:verify

      - name: Android proje dosyalarini uret
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Release APK uret
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: APK dosyasini adlandir
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/DviMobile-phase-5a-fix4-v0.5.4-20260512.apk

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: DviMobile-phase-5a-fix4-v0.5.4-20260512.apk
          path: artifacts/DviMobile-phase-5a-fix4-v0.5.4-20260512.apk
