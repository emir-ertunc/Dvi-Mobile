name: Phase 4C APK

on:
  push:
    branches:
      - feature/turkish-dvi-mobile
  workflow_dispatch:

jobs:
  android-apk:
    name: Android APK üretimi
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: TypeScript kontrolü
        run: npm run typecheck

      - name: Türkçe metin kontrolü
        run: npm run text:verify-tr

      - name: Yeniden baz alma kontrolü
        run: npm run rebaseline:verify

      - name: Fillable PDF forensics doğrulaması
        run: npm run forensics:verify

      - name: AM envanter doğrulaması
        run: npm run inventory:am:verify

      - name: PM envanter doğrulaması
        run: npm run inventory:pm:verify

      - name: AM/PM ortak envanter denetimi
        run: npm run inventory:audit:verify

      - name: Field primitive doğrulaması
        run: npm run schema:primitives:verify

      - name: AM schema doğrulaması
        run: npm run schema:am:verify

      - name: PM schema doğrulaması
        run: npm run schema:pm:verify

      - name: Schema coverage doğrulaması
        run: npm run schema:coverage:verify

      - name: Yerel taslak saklama doğrulaması
        run: npm run drafts:storage:verify

      - name: Ortak form renderer doğrulaması
        run: npm run forms:renderer:verify

      - name: Android proje dosyalarını üret
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Release APK üret
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: APK dosyasını adlandır
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/DviMobile-phase-4c-v0.4.2-20260511.apk

      - name: APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: DviMobile-phase-4c-v0.4.2-20260511.apk
          path: artifacts/DviMobile-phase-4c-v0.4.2-20260511.apk
